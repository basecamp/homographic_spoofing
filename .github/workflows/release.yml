name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # Manual runs are always a dry-run rehearsal: build only, never publish.

permissions: {}

# One run per tag, and never cancel one that may already be publishing. The
# group is per ref: a workflow-wide group would hold only one pending run, so a
# third tag pushed while one is publishing would evict the second unpublished.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4.5"
          # No restored cache in the release path: the published gem must not
          # depend on bytes a cache could poison.
          bundler-cache: false
      - run: bundle install --jobs 4 --retry 3
      - run: bin/test

  # Build is deliberately separate from publish: it carries no `environment:`
  # and no credentials, so a workflow_dispatch rehearsal builds from any ref
  # without the release-rubygems approval. Publish pushes the exact .gem built
  # here rather than rebuilding it.
  build:
    name: Build gem
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4.5"
          # No restored cache in the release path: the published gem must not
          # depend on bytes a cache could poison.
          bundler-cache: false

      - name: Verify tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Determine and verify version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gem_version="$(ruby -Ilib -rhomographic_spoofing/version -e 'puts HomographicSpoofing::VERSION')"
          if [ "$EVENT_NAME" = push ]; then
            tag_version="${REF_NAME#v}"
            if [ "$gem_version" != "$tag_version" ]; then
              echo "::error::Gem version ($gem_version) does not match tag ($REF_NAME)"
              exit 1
            fi
            echo "Releasing version: $gem_version"
          else
            echo "Rehearsal for version: $gem_version"
          fi
          echo "version=$gem_version" >> "$GITHUB_OUTPUT"

      - name: Build gem
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bundle install --jobs 4 --retry 3
          gem build homographic_spoofing.gemspec
          ls -l "homographic_spoofing-${VERSION}.gem"

      # `gem push` has no dry run, so verify the built artifact here. The gemspec
      # collects its files from a Dir glob, so a bad checkout could yield a
      # well-formed gem with no library in it — which RubyGems accepts and users
      # cannot require.
      - name: Verify packaged gem
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ruby -e '
            require "rubygems/package"
            spec = Gem::Package.new(ARGV[0]).spec
            abort "::error::Packaged name is #{spec.name}, expected homographic_spoofing" unless spec.name == "homographic_spoofing"
            abort "::error::Packaged version is #{spec.version}, expected #{ARGV[1]}" unless spec.version.to_s == ARGV[1]
            lib = spec.files.grep(%r{\Alib/})
            abort "::error::Packaged gem contains no lib/ files" if lib.empty?
            abort "::error::Packaged gem is missing lib/homographic_spoofing.rb" unless lib.include?("lib/homographic_spoofing.rb")
            puts "Packaged #{spec.full_name}: #{spec.files.size} files, #{lib.size} under lib/"
          ' "homographic_spoofing-${VERSION}.gem" "$VERSION"

      - name: Dry-run report
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "::notice::Dry run — would publish homographic_spoofing-${VERSION}.gem to RubyGems"

      # overwrite: a "Re-run all jobs" keeps the earlier attempt's artifact on the
      # run, and a second upload under the same name is otherwise rejected before
      # any of the idempotent publish steps can run.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rubygem
          overwrite: true
          path: homographic_spoofing-${{ steps.version.outputs.version }}.gem
          if-no-files-found: error
          # Long enough for the release-rubygems approval to wait; the publish job
          # downloads this artifact after approval.
          retention-days: 30

  # Trusted publishing: RubyGems exchanges the workflow's OIDC token (id-token:
  # write) for short-lived credentials. No stored API key, no hand-typed OTP.
  # The release-rubygems environment is where the owner can require a reviewer.
  publish:
    name: Publish to RubyGems
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-rubygems
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      # No checkout: this job pushes the gem the build job produced. No
      # setup-ruby either: it downloads a Ruby build at run time, and anything
      # that runs here can mint this job's OIDC token, so `gem push` uses the
      # runner image's own Ruby.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rubygem
      # Last check before the irreversible step: the tag may have been deleted or
      # moved while the release-rubygems approval waited, and the check in the
      # github-release job runs too late to undo a publish.
      - name: Verify the tag still points at the released commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          ref="$(gh api "repos/${REPO}/git/ref/tags/${TAG}")"
          sha="$(jq -r .object.sha <<<"$ref")"
          if [ "$(jq -r .object.type <<<"$ref")" = tag ]; then
            sha="$(gh api "repos/${REPO}/git/tags/${sha}" --jq .object.sha)"
          fi
          if [ "$sha" != "$SHA" ]; then
            echo "::error::Tag $TAG points at ${sha:-nothing}, not the released commit $SHA"
            exit 1
          fi
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push to RubyGems
        id: push
        run: |
          set +e
          output="$(gem push "homographic_spoofing-${VERSION}.gem" 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "Publish succeeded."
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          elif grep -qi "repushing of gem versions is not allowed\|already been pushed" <<<"$output"; then
            echo "Version already published — treating as success for idempotency."
          else
            exit "$status"
          fi
      # Deletes only the credentials file. The trusted-publishing action also
      # exports the key as RUBYGEMS_API_KEY, BUNDLE_GEM__PUSH_KEY and
      # GEM_HOST_API_KEY for the rest of this job, so nothing else may run here
      # after the push; waiting for the index happens in the await job.
      - name: Remove credentials created by the trusted-publishing action
        if: always()
        run: ruby -e 'path = File.expand_path("~/.gem/credentials"); File.delete(path) if File.file?(path) && !File.symlink?(path)'

  # Its own job, with no permissions, so the wait runs nowhere near the
  # publishing credential or the OIDC token; it gets the version, whether the
  # publish job pushed, and the gem the build job made.
  await:
    name: Wait for the gem on RubyGems
    needs: [build, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rubygem
      # Ruby to read the quick gemspec, with RubyGems' safe loader.
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4.5"

      # rubygems-await used to run here. It reads the compact index through
      # Bundler's CompactIndexClient; Bundler 4.1.0, which `gem exec` installs
      # beside it, moved that class out of the Bundler namespace, and the
      # fallback then asks RubyGems' cache for a method it does not have. It
      # crashes on every poll, pinned to 0.5.4 or not, so it times out after a
      # push that worked, as it did for basecamp-sdk v0.38.0 and v0.39.0.
      #
      # This waits on what `gem install` and Bundler fetch, all from the
      # public index:
      #   - /info/homographic_spoofing has the version's line, and the sha256 that line
      #     names is the .gem's (Bundler refuses a download that differs);
      #   - /versions' last line for homographic_spoofing carries that file's MD5,
      #     which is how Bundler knows its cached copy is stale (read from
      #     the file's tail, where new lines are appended, and in full only
      #     when the tail has none);
      #   - the quick gemspec that RubyGems before 4.1 reads to install, as
      #     this gem's spec at this version, read with RubyGems' own safe
      #     loader (never Marshal.load on downloaded data), not merely a 200;
      #   - the .gem itself, whose sha256 must match the v2 API's.
      # When this job did the push, that sha256 must also be the gem it
      # pushed. A run that found the version already published may have
      # rebuilt the gem (a full re-run does, and `gem build` stamps it with
      # the time), so its local file is not compared. A check that has passed
      # is not repeated while what it read stays the same, so a re-run long
      # after a release stops reading the full /versions once it has matched. Each request gives up after a
      # minute (the full /versions after three) or at the ten-minute deadline,
      # whichever is sooner, so the step reports what was missing well inside
      # its fifteen-minute limit.
      - name: Wait until the gem is installable
        shell: bash
        timeout-minutes: 15
        env:
          PUSHED: ${{ needs.publish.outputs.pushed }}
          AWAIT_SECONDS: 600
        run: |
          want=""
          if [ "$PUSHED" = true ]; then
            want=$(sha256sum "homographic_spoofing-${VERSION}.gem" | cut -d' ' -f1)
          fi
          # No request starts after the deadline, and none runs more than a
          # second past it (SECONDS counts whole seconds).
          fetch() {
            local left=$((deadline - SECONDS)) max=${limit:-60}
            [ "$left" -gt 0 ] || return 1
            [ "$left" -lt "$max" ] && max=$left
            curl -fsS --connect-timeout 10 --max-time "$max" -o "$2" "${@:3}" "$1" 2>/dev/null
          }
          index_line() { { tail -n +2 "$1" | grep '^homographic_spoofing ' || true; } | tail -n 1 | awk '{print $NF}'; }
          scratch=$(mktemp -d)
          deadline=$((SECONDS + AWAIT_SECONDS))
          info=no listed=no spec=no api="" file="" indexed="" verified=""
          while :; do
            # Read again while the index names another sha256 than the API's:
            # metadata that disagrees is not yet the release. What the last read
            # found stands until a newer read replaces it, and the /info body
            # /versions last vouched for is not checked against it again.
            if [ "$listed" = no ] || { [ -n "$api" ] && [ "$indexed" != "$api" ]; }; then
              line=""
              if fetch "https://index.rubygems.org/info/homographic_spoofing" "$scratch/info"; then
                info=no indexed=""
                line=$({ grep "^${VERSION//./\\.} " "$scratch/info" || true; } | tail -n 1)
              fi
              if [ -n "$line" ]; then
                info=yes
                indexed=$(sed -nE 's/.*[|,]checksum:([0-9a-f]{64})(,.*)?$/\1/p' <<<"$line")
                md5=$(md5sum "$scratch/info" | cut -d' ' -f1)
                if [ "$md5" != "$verified" ]; then
                  listed=no
                  last=""
                  if fetch "https://index.rubygems.org/versions" "$scratch/versions" -r -2000000; then
                    last=$(index_line "$scratch/versions")
                  fi
                  if [ -z "$last" ] && limit=180 fetch "https://index.rubygems.org/versions" "$scratch/versions"; then
                    last=$(index_line "$scratch/versions")
                  fi
                  if [ "$last" = "$md5" ]; then
                    listed=yes verified=$md5
                  fi
                fi
              elif [ "$info" = no ]; then
                listed=no
              fi
            fi
            if [ "$spec" = no ] && fetch "https://rubygems.org/quick/Marshal.4.8/homographic_spoofing-${VERSION}.gemspec.rz" "$scratch/spec" \
                && ruby -rzlib -rrubygems/safe_marshal -e '
                     spec = Gem::SafeMarshal.safe_load(Zlib::Inflate.inflate(File.binread(ARGV[0])))
                     exit(spec.is_a?(Gem::Specification) && spec.name == ARGV[1] && spec.version.to_s == ARGV[2])
                   ' "$scratch/spec" "homographic_spoofing" "$VERSION" 2>/dev/null; then
              spec=yes
            fi
            if [ -z "$api" ] && fetch "https://rubygems.org/api/v2/rubygems/homographic_spoofing/versions/${VERSION}.json" "$scratch/api.json"; then
              api=$(jq -r '.sha // empty' "$scratch/api.json" 2>/dev/null || true)
              [[ "$api" =~ ^[0-9a-f]{64}$ ]] || api=""
            fi
            if [ -n "$want" ] && [ -n "$api" ] && [ "$api" != "$want" ]; then
              echo "::error::RubyGems reports homographic_spoofing ${VERSION} with sha256 ${api}, not the ${want} this job pushed."
              exit 1
            fi
            if [ -n "$api" ] && [ "$file" != "$api" ] && fetch "https://rubygems.org/gems/homographic_spoofing-${VERSION}.gem" "$scratch/gem"; then
              file=$(sha256sum "$scratch/gem" | cut -d' ' -f1)
            fi
            state="info: ${info}, versions: ${listed}, gemspec: ${spec}, API sha256: ${api:-none}, index sha256: ${indexed:-none}, downloaded sha256: ${file:-none}"
            if [ "$info" = yes ] && [ "$listed" = yes ] && [ "$spec" = yes ] && [ -n "$api" ] && [ "$indexed" = "$api" ] && [ "$file" = "$api" ]; then
              echo "homographic_spoofing ${VERSION} is installable (${state})."
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::homographic_spoofing ${VERSION} was not installable after ${AWAIT_SECONDS}s of polling (${state})."
              exit 1
            fi
            echo "Waiting for homographic_spoofing ${VERSION} (${state})..."
            sleep 15
          done

  # A GitHub Release per tag, with the gem attached and notes generated from the
  # merged PRs since the previous tag. changelog_uri and the human CHANGELOG both
  # live in the repo; this gives downstreams a versioned, dated release page too.
  github-release:
    name: GitHub Release
    needs: [build, publish, await]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rubygem
      # The tag may have been deleted or moved while earlier jobs ran or an
      # approval waited; the release must point at the commit whose gem was built
      # and published, on both the create and the recovery path below.
      - name: Verify the tag still points at the released commit
        env:
          SHA: ${{ github.sha }}
        run: |
          ref="$(gh api "repos/${REPO}/git/ref/tags/${TAG}")"
          sha="$(jq -r .object.sha <<<"$ref")"
          if [ "$(jq -r .object.type <<<"$ref")" = tag ]; then
            sha="$(gh api "repos/${REPO}/git/tags/${sha}" --jq .object.sha)"
          fi
          if [ "$sha" != "$SHA" ]; then
            echo "::error::Tag $TAG points at ${sha:-nothing}, not the released commit $SHA"
            exit 1
          fi

      - name: Create the release from the tag
        run: |
          gem="homographic_spoofing-${VERSION}.gem"
          gem_version="$(ruby -e 'require "rubygems/package"; puts Gem::Package.new(ARGV[0]).spec.version' "$gem")"
          [ "$gem_version" = "$VERSION" ]
          # Idempotent, matching the publish job: a re-run after a partial release
          # completes the existing release rather than failing. gh creates the
          # release as a draft, uploads, then publishes, so recovery may find a
          # draft with or without its asset. An asset already fully uploaded is
          # left alone — --clobber deletes before it uploads, and a failed
          # re-upload would lose the good copy — and only a missing or broken one
          # is replaced; then a still-draft release is published.
          if release="$(gh release view "$TAG" --repo "$REPO" --json isDraft,assets 2>/dev/null)"; then
            state="$(jq -r --arg name "$gem" '.assets[] | select(.name == $name) | .state' <<<"$release")"
            if [ "$state" = uploaded ]; then
              echo "Release $TAG already carries $gem; leaving it in place."
            else
              gh release upload "$TAG" --repo "$REPO" --clobber "$gem"
            fi
            if [ "$(jq -r .isDraft <<<"$release")" = true ]; then
              gh release edit "$TAG" --repo "$REPO" --draft=false
            fi
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TAG" \
              --verify-tag \
              --generate-notes \
              "$gem"
          fi
